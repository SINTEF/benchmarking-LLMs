# Example LionLinker LLM runner config.
dataset: mv
max_rows: 5
lamapi:
  endpoint: ${ENTITY_RETRIEVAL_ENDPOINT}
  token: ${ENTITY_RETRIEVAL_TOKEN}
  limit: 10
forcing:
  force_gt_candidate: false
  force_ids: []
output:
  base_dir: outputs
  method: llm
model:
  name: gpt-oss-120b
  provider: openrouter
  prompt_schema: base
